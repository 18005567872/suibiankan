name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:  # Allows manual trigger from GitHub web UI

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Generate Gradle wrapper
        run: |
          # Create gradle wrapper properties
          mkdir -p gradle/wrapper
          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-bin.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

      - name: Make gradlew executable
        run: |
          # Create a minimal gradlew script
          cat > gradlew << 'EOF'
          #!/bin/bash
          export GRADLE_USER_HOME="${HOME}/.gradle"
          GRADLE_VERSION="8.5"
          GRADLE_DIST="gradle-${GRADLE_VERSION}-bin.zip"
          GRADLE_DIR="${GRADLE_USER_HOME}/wrapper/dists/${GRADLE_DIST}"
          if [ ! -f "${GRADLE_DIR}/gradle-${GRADLE_VERSION}/bin/gradle" ]; then
            mkdir -p "${GRADLE_DIR}"
            curl -sL "https://services.gradle.org/distributions/${GRADLE_DIST}" -o "${GRADLE_DIR}/${GRADLE_DIST}"
            unzip -qo "${GRADLE_DIR}/${GRADLE_DIST}" -d "${GRADLE_DIR}"
          fi
          exec "${GRADLE_DIR}/gradle-${GRADLE_VERSION}/bin/gradle" "$@"
          EOF
          chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: 随便看-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90
